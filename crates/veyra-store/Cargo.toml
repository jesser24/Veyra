[package]
name = "veyra-store"
version = "0.1.0"
edition = "2021"
description = "Encrypted local storage for Veyra: vault (master password + recovery key), SQLCipher database, encrypted attachments, backups."

[dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
