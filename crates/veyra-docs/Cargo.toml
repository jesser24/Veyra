[package]
name = "veyra-docs"
version = "0.1.0"
edition = "2021"
description = "Local, bounded extraction of text/structure from files the user attaches (PDF, Office, CSV, archives, code, images). Pure Rust, no network, never executes anything."

[dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
calamine = "0.38"
pdf-extract = "0.12"
sevenz-rust2 = { version = "0.25", default-features = false }
imagesize = "0.15"
serde = { version = "1", features = ["derive"] }
