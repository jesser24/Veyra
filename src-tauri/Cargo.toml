[package]
name = "veyra"
version = "0.1.0"
edition = "2021"
description = "Veyra — floating, private-by-design AI assistant"
default-run = "veyra"

[lib]
name = "veyra_lib"
crate-type = ["rlib"]

[[bin]]
name = "veyra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
veyra-core = { path = "../crates/veyra-core" }
veyra-net = { path = "../crates/veyra-net" }
veyra-ai = { path = "../crates/veyra-ai" }
veyra-store = { path = "../crates/veyra-store" }
reqwest = { version = "0.12", default-features = false }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
