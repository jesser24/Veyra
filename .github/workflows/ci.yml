name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: never

jobs:
  web:
    name: Front-end (typecheck, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  core:
    name: Rust core (fmt-free tests, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p veyra-core -p veyra-store -p veyra-net -p veyra-ai -p veyra-llama -p veyra-docs --locked

  engine-cross-os:
    name: Net + AI engine tests (${{ matrix.os }})
    needs: [libllama]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-2022 }
          - { label: macos-arm64, os: macos-15 }
          - { label: macos-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with: { name: "libllama-${{ matrix.label }}", path: libllama }
      - name: Point the build at the inference library built from the pinned llama.cpp commit
        shell: bash
        run: echo "VEYRA_LLAMA_DIR=${GITHUB_WORKSPACE}/libllama" >> "$GITHUB_ENV"
      # the native binding (libllama linked statically), the gateway and the resumable download behave differently per OS: test on each
      - run: cargo test -p veyra-net -p veyra-ai -p veyra-llama -p veyra-docs --locked

  libllama:
    name: libllama b12336, static (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-2022, arch: x64 }
          - { label: macos-arm64, os: macos-15, arch: arm64 }
          - { label: macos-x64, os: macos-15-intel, arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Build libllama from the pinned commit as static libraries (no prebuilt binary is downloaded)
        shell: bash
        run: scripts/build-libllama.sh "$RUNNER_TEMP/llama-work" "$PWD/libllama"
      - name: List what was built
        shell: bash
        run: find libllama -maxdepth 2 -type f | head -50
      - uses: actions/upload-artifact@v4
        with: { name: "libllama-${{ matrix.label }}", path: libllama/, if-no-files-found: error }

  real-inference:
    # REAL inference: the real libllama linked into Veyra's own process, built above + a real model downloaded through Veyra's own gateway (official Hugging Face URL, SHA-256 checked).
    # Qwen3-0.6B is used because it is small enough for a CI runner; it proves the whole pipeline, not the speed of the recommended 4B model.
    name: Real inference, Qwen3-0.6B (${{ matrix.label }})
    needs: [libllama]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-2022 }
          - { label: macos-arm64, os: macos-15 }
          - { label: macos-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with: { name: "libllama-${{ matrix.label }}", path: libllama }
      - name: Point the build at the inference library built from the pinned llama.cpp commit
        shell: bash
        run: echo "VEYRA_LLAMA_DIR=${GITHUB_WORKSPACE}/libllama" >> "$GITHUB_ENV"
      - name: Run the benchmark with --check (download, load, stream, cancel, long prompt, unload/reload, no child process)
        shell: bash
        run: cargo run --release --locked -p veyra-ai --bin veyra-bench -- --dir "$RUNNER_TEMP/models" --model qwen3-0.6b-q8_0 --runs 2 --long --check --out bench-${{ matrix.label }}.json 2>&1 | tee bench-${{ matrix.label }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "bench-${{ matrix.label }}", path: "bench-${{ matrix.label }}.*", if-no-files-found: warn }

  bundle:
    name: Bundle ${{ matrix.label }}
    needs: [web, core, libllama]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-2022, platform: windows, bundles: nsis, target: "" }
          - { label: macos-arm64, os: macos-15, platform: macos, bundles: "app,dmg", target: "" }
          - { label: macos-x64, os: macos-15-intel, platform: macos, bundles: "app,dmg", target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version; cargo --version; node --version; npm --version
      - run: npm ci
        shell: bash
      - uses: actions/download-artifact@v4
        with: { name: "libllama-${{ matrix.label }}", path: libllama }
      - name: Point the build at the inference library built from the pinned llama.cpp commit
        shell: bash
        run: echo "VEYRA_LLAMA_DIR=${GITHUB_WORKSPACE}/libllama" >> "$GITHUB_ENV"
      - name: Windows only - use Strawberry Perl for the vendored OpenSSL build (Git's MSYS perl lacks modules)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la /c/Strawberry/perl/bin/perl.exe
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          (command -v nasm || ls "/c/Program Files/NASM/nasm.exe") 2>&1 || echo "no NASM found (OpenSSL falls back to portable C code if so)"
      - name: Build (logs kept)
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          npx tauri build --ci --bundles ${{ matrix.bundles }} 2>&1 | tee logs/tauri-build-${{ matrix.label }}.log
      - name: Real-window self-test (toggle docking, click opens panel, second click, drag release)
        # Runs the app itself with VEYRA_SELFTEST=1 on a real OS. continue-on-error until it has been seen passing on every runner.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p logs "$RUNNER_TEMP/veyra-data"
          BIN=$(ls target/release/Veyra.exe target/release/Veyra target/release/veyra 2>/dev/null | head -1)
          echo "binary: $BIN"
          VEYRA_SELFTEST=1 VEYRA_DATA_DIR="$RUNNER_TEMP/veyra-data" VEYRA_SELFTEST_OUT="$PWD/logs/selftest.json" "$BIN" &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null; wait $pid; echo "exit code: $?"
          cp "$RUNNER_TEMP/veyra-data/logs/veyra.log" logs/veyra-app.log 2>/dev/null
          test -f logs/selftest.json || { echo "selftest produced no result file"; exit 1; }
          cat logs/selftest.json; echo
          node -e "const r=JSON.parse(require('fs').readFileSync('logs/selftest.json','utf8')); r.checks.forEach(c=>console.log((c.ok?'PASS ':'FAIL ')+c.name+(c.ok?'':'  '+c.detail))); process.exit(r.ok?0:1)"
      - name: Verify installers exist (fails the job otherwise)
        shell: bash
        run: node scripts/verify-artifacts.mjs ${{ matrix.platform }} ${{ matrix.label }} release-out
      - uses: actions/upload-artifact@v4
        with: { name: "veyra-${{ matrix.label }}", path: release-out/, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "logs-${{ matrix.label }}", path: logs/, if-no-files-found: warn }
